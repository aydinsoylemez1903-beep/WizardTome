const characterStatus=document.getElementById('modelStatus');
let realAsset=null;
async function installCharacter(gltf){
  const obj=gltf.scene;
  const bounds=new THREE.Box3().setFromObject(obj),height=bounds.getSize(new THREE.Vector3()).y;
  if(!Number.isFinite(height)||height<.01)throw Error('Model boyutu geçersiz');
  obj.scale.setScalar(2.9/height);
  obj.updateMatrixWorld(true);
  const scaled=new THREE.Box3().setFromObject(obj),center=scaled.getCenter(new THREE.Vector3());
  obj.position.set(-center.x,-scaled.min.y,-center.z);
  if(realAsset)player.remove(realAsset);
  player.add(obj);realAsset=obj;torso.visible=false;
  let rig=false;obj.traverse(o=>{if(o.isSkinnedMesh)rig=true});
  characterStatus.textContent=rig?'Seçilen 3D model açıldı • rig var':'Seçilen 3D model açıldı • rig yok';
}
// Persist the user's actual GLB locally, without external file-hosting or paid services.
// IndexedDB is best-effort: Safari private browsing or cleared website data can remove it.
const CACHE_DB='WizardTomeHeroDB',CACHE_STORE='models',CACHE_KEY='selectedHeroGLB';
function heroDatabase(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(CACHE_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(CACHE_STORE))db.createObjectStore(CACHE_STORE)};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function cacheHero(bytes){
  const db=await heroDatabase();
  try{await new Promise((resolve,reject)=>{const tx=db.transaction(CACHE_STORE,'readwrite');tx.objectStore(CACHE_STORE).put(bytes,CACHE_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
  finally{db.close()}
}
async function readHero(){
  const db=await heroDatabase();
  try{return await new Promise((resolve,reject)=>{const r=db.transaction(CACHE_STORE,'readonly').objectStore(CACHE_STORE).get(CACHE_KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
  finally{db.close()}
}
async function useHeroBuffer(buffer){
  const {GLTFLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js');
  const gltf=await new Promise((resolve,reject)=>new GLTFLoader().parse(buffer,'',resolve,reject));
  await installCharacter(gltf);
}

    const buffer=await file.arrayBuffer();
    await useHeroBuffer(buffer);
    try{await cacheHero(buffer);characterStatus.textContent+=' • telefona kaydedildi'}
    catch(storageError){characterStatus.textContent+=' • yerel kayıt yapılamadı';console.warn(storageError)}
  }catch(err){characterStatus.textContent='Dosya açılamadı • '+(err.message||'hata');console.error(err)}
});
