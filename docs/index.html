<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#11162c"><title>WizardTome — Mobile Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10162a;color:white;font:600 15px system-ui;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block}#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(15px,env(safe-area-inset-left));text-shadow:0 2px 5px #000;pointer-events:none}#hud small{display:block;color:#d2befb}#bar{height:8px;width:150px;border:1px solid #ac9cda;border-radius:9px;margin-top:8px;background:#272743}#fill{height:100%;width:100%;background:#66c7fa;border-radius:8px}#pad{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:max(26px,env(safe-area-inset-left));width:126px;height:126px;border:2px solid #b9b7ed88;border-radius:50%;background:#6c66ac33;touch-action:none}#knob{position:absolute;left:38px;top:38px;width:46px;height:46px;border-radius:50%;background:#c1b1faab;pointer-events:none}button{position:absolute;border:2px solid #c9b6f9aa;color:white;font-weight:800;border-radius:50%;touch-action:none;background:#5e3f99bb;box-shadow:0 3px 15px #100e30bb}#spell{right:max(24px,env(safe-area-inset-right));bottom:38px;width:86px;height:86px;background:#693cb9dd}#jump{right:122px;bottom:24px;width:58px;height:58px}#run{right:122px;bottom:94px;width:58px;height:58px}#note{position:absolute;top:12px;right:14px;font-size:12px;color:#eae7ff;pointer-events:none}#rotate{display:none;position:fixed;inset:0;z-index:10;background:#15152c;text-align:center;align-items:center;justify-content:center;padding:28px;font-size:22px}#hint{position:absolute;bottom:8px;left:40%;font-size:11px;opacity:.75;pointer-events:none}@media(orientation:portrait){#rotate{display:flex}}@media(max-height:380px){#pad{width:100px;height:100px}#knob{left:29px;top:29px;width:40px;height:40px}#spell{width:68px;height:68px}#jump,#run{width:49px;height:49px;right:102px}}
</style></head><body>
<div id="hud">✦ WIZARDTOME <small>Mobil 3D prototip • v0.2</small><div id="bar"><div id="fill"></div></div><small id="status">Mana 100 • Golem 3/3</small></div><div id="note">Sağ tarafta kaydır: kamera</div><div id="pad"><div id="knob"></div></div><button id="spell">BÜYÜ</button><button id="jump">ZIPLA</button><button id="run">KOŞ</button><div id="hint">Soldan hareket et • sağdan bak</div><div id="rotate">📱 Telefonu yatay çevir.<br>WizardTome yatay oynanır.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8893be);scene.fog=new THREE.Fog(0x8893be,32,92);
const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,140);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdee3ff,0x303a51,2.2));const sun=new THREE.DirectionalLight(0xffd4ae,2.4);sun.position.set(-18,30,16);scene.add(sun);
const mats={grass:0x386e58,path:0x75728b,rock:0x55526f,roof:0x713ab7,wood:0x594752,leaf:0x276765,crystal:0x66d8ff,robe:0x7547c4,gold:0xf6c984,face:0xe4b89e,dark:0x2b2641};
function mat(color){return new THREE.MeshStandardMaterial({color,roughness:.7,metalness:0})}
const m={};for(const k in mats)m[k]=mat(mats[k]);
function box(x,y,z,sx,sy,sz,material,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);o.position.set(x,y,z);parent.add(o);return o}
function ball(x,y,z,r,material,parent=scene){const o=new THREE.Mesh(new THREE.SphereGeometry(r,12,9),material);o.position.set(x,y,z);parent.add(o);return o}
function cyl(x,y,z,top,bottom,height,material,parent=scene){const o=new THREE.Mesh(new THREE.CylinderGeometry(top,bottom,height,10),material);o.position.set(x,y,z);parent.add(o);return o}
box(0,-1,0,72,2,72,m.grass);box(0,.01,0,6,.035,52,m.path);
for(let i=-1;i<=1;i++){const t=i*15;cyl(t,3,25,2.3,2.7,6,m.rock);cyl(t,6.2,25,3.4,3.4,.65,m.roof);ball(t,7.1,25,.64,m.crystal);
for(const x of [-19,19]){cyl(x,2,i*14-5,.37,.55,4,m.wood);ball(x,4.6,i*14-5,2.2,m.leaf)}
for(const x of [-9,9]){const c=box(x,.76,i*12+5,.9,1.4,.9,m.crystal);c.rotation.set(.3,.6,.25)}}
const player=new THREE.Group();scene.add(player);player.position.set(0,0,-15);
cyl(0,1.05,0,.33,.56,1.6,m.robe,player);ball(0,2.04,0,.34,m.face,player);cyl(0,2.37,0,.57,.57,.12,m.dark,player);cyl(0,2.7,0,.08,.44,.67,m.dark,player);cyl(.58,1.12,.08,.07,.07,1.8,m.wood,player);ball(.58,2.05,.08,.19,m.crystal,player);
const golems=[];for(let i=0;i<3;i++){const root=new THREE.Group();root.position.set((i-1)*6,0,9);scene.add(root);box(0,1.45,0,1.35,1.8,1.1,m.rock,root);box(0,2.67,0,1,.75,.85,m.dark,root);ball(-.24,2.7,-.47,.12,m.crystal,root);ball(.24,2.7,-.47,.12,m.crystal,root);golems.push({root,hp:100,respawn:0})}
const keys={x:0,y:0,run:false,jump:false},pad=document.getElementById('pad'),knob=document.getElementById('knob');let padId=null,cameraId=null,lastCamX=0,lastCamY=0,yaw=0,pitch=.25,mana=100,cooldown=0,vy=0,grounded=true;const shots=[];
function stick(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width*.37),dy=(e.clientY-cy)/(r.height*.37);const length=Math.max(1,Math.hypot(dx,dy));dx/=length;dy/=length;keys.x=dx;keys.y=-dy;knob.style.transform='translate('+dx*(r.width*.32)+'px,'+dy*(r.height*.32)+'px)'}
pad.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;pad.setPointerCapture(padId);stick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)stick(e)});function stopStick(e){if(e.pointerId===padId){padId=null;keys.x=keys.y=0;knob.style.transform=''}}pad.addEventListener('pointerup',stopStick);pad.addEventListener('pointercancel',stopStick);
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{if(cameraId===null){cameraId=e.pointerId;lastCamX=e.clientX;lastCamY=e.clientY;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(cameraId!==e.pointerId)return;yaw-=(e.clientX-lastCamX)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastCamY)*.004,-.2,1.0);lastCamX=e.clientX;lastCamY=e.clientY});function stopCam(e){if(cameraId===e.pointerId)cameraId=null}canvas.addEventListener('pointerup',stopCam);canvas.addEventListener('pointercancel',stopCam);
const run=document.getElementById('run');run.addEventListener('pointerdown',e=>{e.preventDefault();keys.run=true;run.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel'])run.addEventListener(ev,()=>keys.run=false);
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();keys.jump=true});
document.getElementById('spell').addEventListener('pointerdown',e=>{e.preventDefault();cast()});
function cast(){if(mana<20||cooldown>0)return;mana-=20;cooldown=.43;const p=ball(0,0,0,.22,new THREE.MeshBasicMaterial({color:0x76e2ff}));p.position.copy(player.position).add(new THREE.Vector3(0,1.5,0));const d=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));p.position.addScaledVector(d,.85);shots.push({mesh:p,d,ttl:2})}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
let previous=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-previous)/1000,.04);previous=now;
const dx=keys.x,dz=keys.y;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),dir=forward.clone().multiplyScalar(dz).addScaledVector(right,dx);if(dir.lengthSq()>1)dir.normalize();
player.position.addScaledVector(dir,dt*(keys.run?8:4.7));player.position.x=THREE.MathUtils.clamp(player.position.x,-34,34);player.position.z=THREE.MathUtils.clamp(player.position.z,-34,34);
if(dir.lengthSq()>.01)player.rotation.y=Math.atan2(-dir.x,-dir.z);
if(keys.jump&&grounded){vy=7;grounded=false}keys.jump=false;vy-=19*dt;player.position.y+=vy*dt;if(player.position.y<0){player.position.y=0;vy=0;grounded=true}
const focus=player.position.clone().add(new THREE.Vector3(0,1.5,0));const desired=focus.clone().add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch)*6,Math.sin(pitch)*6+1.3,Math.cos(yaw)*Math.cos(pitch)*6));camera.position.lerp(desired,Math.min(1,dt*10));camera.lookAt(focus);
mana=Math.min(100,mana+dt*13);cooldown=Math.max(0,cooldown-dt);
for(let j=shots.length-1;j>=0;j--){const s=shots[j];s.mesh.position.addScaledVector(s.d,dt*25);s.ttl-=dt;let hit=false;for(const g of golems){if(g.hp>0&&s.mesh.position.distanceTo(g.root.position.clone().add(new THREE.Vector3(0,1.5,0)))<1.25){g.hp-=35;if(g.hp<=0){g.root.visible=false;g.respawn=now/1000+4}hit=true;break}}if(hit||s.ttl<=0){scene.remove(s.mesh);shots.splice(j,1)}}
for(const g of golems){if(g.hp<=0&&now/1000>g.respawn){g.hp=100;g.root.visible=true}}
document.getElementById('fill').style.width=mana+'%';document.getElementById('status').textContent='Mana '+Math.ceil(mana)+' • Golem '+golems.filter(g=>g.hp>0).length+'/3';
renderer.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
